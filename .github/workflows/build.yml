name: Сборка APK и обновления

on:
  push:
    branches: [main]
    paths-ignore:
      - "assets/raw/**"
      - "tools-static/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: 0.1.${{ github.run_number }}

jobs:
  android:
    name: APK и пакет обновления
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - name: Пакет обновления
        run: |
          mkdir -p dist
          (cd www && zip -qr ../dist/bundle.zip .)
          node scripts/make-update.mjs www dist/bundle.zip dist/update.json "${APP_VERSION}" "${{ github.repository }}"
      - run: npx cap sync android
      - name: Собрать APK
        working-directory: android
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../dist/dark-realm.apk
      - name: Опубликовать APK и обновление
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Тёмные земли — APK
          body: |
            Последняя сборка: версия ${{ env.APP_VERSION }}.
            Установите dark-realm.apk на Android. Дальше игра обновляется сама; переустанавливать APK нужно, только если об этом попросят.
          files: |
            dist/dark-realm.apk
            dist/bundle.zip
            dist/update.json
          make_latest: true
          overwrite_files: true
      - name: Сайт со скачиванием (GitHub Pages)
        run: |
          mkdir -p site
          cp -r www/. site/
          cp dist/dark-realm.apk dist/bundle.zip dist/update.json site/
          cp tools-static/download.html site/download.html
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
